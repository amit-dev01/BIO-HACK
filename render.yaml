services:
  - type: web
    name: canopyai-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MOCK_MODE
        value: "false"
      - key: GEE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GEE_PRIVATE_KEY_PATH
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

